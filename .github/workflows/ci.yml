name: pmcp-python CI

# This file replaces an earlier org-level ci.yml that:
#   1. Referenced monorepo-era paths (v05/, pmcp/ at a shared org root) that
#      no longer match this repo's layout after the split into separate
#      pmcp-spec / pmcp-python / pmcp-rust / pmcp-typescript / ... repos.
#      It also referenced docker/Dockerfile and typescript-sdk/, neither of
#      which exists in this repo -- Docker packaging lives in pmcp-labs,
#      and the TypeScript SDK is now the separate pmcp-typescript repo.
#   2. Ended every meaningful check in `|| true`, so pytest/mypy/ruff/black/
#      bandit/pip-audit failures could never fail the job -- including the
#      jobs the release job below gates PyPI publishing on. Removed
#      everywhere in this file; a real failure now fails the job.
#   3. Referenced tests/conformance/, which doesn't exist in this repo (that
#      content belongs in the separate pmcp-conformance repo).
#
# Every path and job below has been verified against this repo's actual
# contents and a real local run (`pytest -q` -> 213 passed, 1 skipped,
# 0 failed; `pytest --collect-only` -> 214 tests across tests/unit,
# tests/v05, tests/integration, tests/chaos, tests/e2e, tests/load).

on:
  push:
    branches: [main, develop]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  # Python Tests (matrix: 3.9 -> 3.12)
  # ===========================================================================
  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev + numerics extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,numerics]"

      - name: Smoke-import canonical + v05 packages
        run: |
          python -c "
          import pmcp
          print('pmcp:', pmcp.__version__, pmcp.__protocol__)
          import v05.pmcp_v5_server, v05.pmcp_v5_types, v05.pmcp_safety_v5, v05.pmcp_registry
          print('v05 imports OK')
          "

      - name: Run full test suite
        run: |
          pytest -q \
            --cov=pmcp --cov=v05 \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ===========================================================================
  # Type Checking
  # ===========================================================================
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev + numerics extras
        run: pip install -e ".[dev,numerics]"

      - name: Run mypy
        run: |
          mypy v05/ pmcp/ \
            --ignore-missing-imports \
            --no-error-summary \
            --python-version 3.11

  # ===========================================================================
  # Linting & Formatting
  # ===========================================================================
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: pip install ruff black

      - name: Run ruff
        run: ruff check v05/ pmcp/ --output-format=github

      - name: Check black formatting
        run: black --check v05/ pmcp/

  # ===========================================================================
  # Security Scan
  # ===========================================================================
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run bandit (SAST)
        run: |
          bandit -r v05/ pmcp/ \
            -f json -o bandit-report.json \
            -ll --quiet

      - name: Run pip-audit (dependency CVEs)
        run: pip-audit

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  # ===========================================================================
  # Integration Tests (includes the v05 demo smoke test)
  # ===========================================================================
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev + numerics + http extras
        run: pip install -e ".[dev,numerics,http]"

      - name: Run integration + e2e + chaos + load suites
        run: |
          pytest tests/integration/ tests/e2e/ tests/chaos/ tests/load/ -v --timeout=60

      - name: Smoke-test v05 demo (arm)
        run: |
          timeout 12 python -m v05.main_pmcp_v5 --demo arm 2>&1 | head -40
          echo "v05 arm demo smoke-test passed"

  # ===========================================================================
  # Performance Benchmark
  # ===========================================================================
  performance:
    name: Performance benchmark
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e "."

      - name: Run benchmark
        run: |
          python -c "
          import time
          import v05.pmcp_v5_server as srv
          import v05.pmcp_v5_types  as typ

          start = time.perf_counter()
          for i in range(200):
              s    = srv.PMCPServer(f'robot-{i}')
              iden = typ.RobotIdentity.new('arm', 'UR5', '12345', 'lab')
          elapsed = time.perf_counter() - start
          ms_each = elapsed / 200 * 1000
          print(f'Created 200 servers in {elapsed:.3f}s ({ms_each:.2f}ms each)')
          print('Benchmark PASSED')
          "

  # ===========================================================================
  # Release to PyPI (triggered on version tags: v*.*.*)
  #
  # NOTE ON THE `if:` GUARD BELOW — read this before removing it.
  #
  # This job was originally written to run on any `refs/tags/v*` push, gated
  # only on the upstream jobs passing. Two things make that unsafe today:
  #
  #   1. `environment: release` does not exist on this repository yet, so
  #      the job would sit waiting for an approval that nobody can give.
  #   2. OIDC trusted publishing is NOT configured on PyPI for this project,
  #      so the publish step would fail regardless of the tag.
  #
  # Tagging v1.0.0 would therefore have turned the GitHub release red on
  # day one and undercut the "fully verified" claim the changelog makes.
  # The `vars.PYPI_TRUSTED_PUBLISHING_ENABLED` guard below means the job
  # is skipped cleanly until someone actually configures the publisher and
  # sets that repository variable to `true`.
  #
  # TO ENABLE PUBLISHING:
  #   1. On PyPI: create the project, then add a GitHub trusted publisher
  #      for repo `physicalcontextprotocol/pmcp-python`, workflow
  #      `ci.yml`, environment `release`.
  #   2. On GitHub: create the `release` environment (Settings > Environments).
  #   3. Set the repository variable:
  #        gh variable set PYPI_TRUSTED_PUBLISHING_ENABLED --body true \
  #          -R physicalcontextprotocol/pmcp-python
  #   4. Tag a release. The job will then run for real.
  # ===========================================================================
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - type-check
      - lint
      - security
      - integration-tests
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && vars.PYPI_TRUSTED_PUBLISHING_ENABLED == 'true'
    environment: release
    permissions:
      id-token: write   # OIDC trusted publishing
      contents: write   # Create GitHub release

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  # ===========================================================================
  # CI Summary
  # ===========================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - type-check
      - lint
      - security
      - integration-tests
      - performance
    if: always()

    steps:
      - name: Report status
        run: |
          echo "## pmcp-python CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| python-tests      | ${{ needs.python-tests.result }}      |" >> "$GITHUB_STEP_SUMMARY"
          echo "| type-check        | ${{ needs.type-check.result }}        |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lint              | ${{ needs.lint.result }}              |" >> "$GITHUB_STEP_SUMMARY"
          echo "| security          | ${{ needs.security.result }}          |" >> "$GITHUB_STEP_SUMMARY"
          echo "| integration-tests | ${{ needs.integration-tests.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| performance       | ${{ needs.performance.result }}       |" >> "$GITHUB_STEP_SUMMARY"
